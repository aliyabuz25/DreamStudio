version: "3.8"

networks:
  proxy:
    external: true
  internal:
    internal: true

volumes:
  celalyabuz-ds-db:
  celalyabuz-ds-uploads:
  celalyabuz-ds-auth:

services:

  # ── DREAMSTUDIO WEB ───────────────────────────────────
  dreamstudio-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: celalyabuz-ds:latest
    container_name: celalyabuz-ds
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WA_SERVER_URL: http://celalyabuz-ds-wa:3001
      SITE_URL: https://celalyabuz.store
      ADMIN_PHONE: ${ADMIN_PHONE:-905464233871}
    volumes:
      - celalyabuz-ds-db:/app/admin/db
      - celalyabuz-ds-uploads:/app/admin/uploads
      - celalyabuz-ds-uploads:/app/public/uploads
    depends_on:
      - dreamstudio-wa
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.celalyabuz-ds.rule=Host(`celalyabuz.store`)"
      - "traefik.http.routers.celalyabuz-ds.entrypoints=websecure"
      - "traefik.http.routers.celalyabuz-ds.tls=true"
      - "traefik.http.routers.celalyabuz-ds.tls.certresolver=le"
      - "traefik.http.services.celalyabuz-ds.loadbalancer.server.port=3000"

  # ── DREAMSTUDIO WHATSAPP ─────────────────────────────
  dreamstudio-wa:
    build:
      context: .
      dockerfile: Dockerfile.wa
    image: celalyabuz-ds-wa:latest
    container_name: celalyabuz-ds-wa
    restart: unless-stopped
    volumes:
      - celalyabuz-ds-auth:/app/admin/auth_info
    networks:
      - internal