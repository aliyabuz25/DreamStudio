version: "3.8"

networks:
  edge:
    external: true
  octobot-net:
    external: true
  internal:
    internal: true

volumes:
  celalyabuz-ds-db:
  celalyabuz-ds-uploads:
  celalyabuz-ds-auth:

services:

  # ── DREAMSTUDIO WEB ───────────────────────────────────
  dreamstudio-web:
    container_name: celalyabuz-ds
    build:
      context: .
      dockerfile: Dockerfile
    image: celalyabuz-ds:latest
    pull_policy: build
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      WA_SERVER_URL: "http://celalyabuz-ds-wa:3001"
      SITE_URL: "https://celalyabuz.store"
      ADMIN_PHONE: "${ADMIN_PHONE:-905464233871}"
    volumes:
      - /datastore/celalyabuz/db:/app/admin/db
      - /datastore/celalyabuz/uploads:/app/admin/uploads
      - /datastore/celalyabuz/uploads:/app/public/uploads
    depends_on:
      - dreamstudio-wa
    networks:
      - edge
      - octobot-net
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.celalyabuz-ds.rule=Host(`celalyabuz.store`)"
      - "traefik.http.routers.celalyabuz-ds.entrypoints=web,websecure"
      - "traefik.http.routers.celalyabuz-ds.tls=true"
      - "traefik.http.services.celalyabuz-ds.loadbalancer.server.port=3000"

  # ── DREAMSTUDIO WHATSAPP ─────────────────────────────
  dreamstudio-wa:
    container_name: celalyabuz-ds-wa
    build:
      context: .
      dockerfile: Dockerfile.wa
    image: celalyabuz-ds-wa:latest
    pull_policy: build
    restart: unless-stopped
    volumes:
      - /datastore/celalyabuz/auth:/app/admin/auth_info
    networks:
      - internal