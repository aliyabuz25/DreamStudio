version: '3.8'

networks:
  proxy:
    external: true
  internal:
    internal: true

volumes:
  celalyabuz-ds-db:
  celalyabuz-ds-uploads:
  celalyabuz-ds-auth:
  traefik-certs:

services:

  # ── TRAEFIK ──────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=info@celalyabuz.store"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/letsencrypt"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.celalyabuz.store`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_AUTH}"

  # ── DREAMSTUDIO WEB ───────────────────────────────────
  dreamstudio-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: celalyabuz-ds:latest
    container_name: celalyabuz-ds
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WA_SERVER_URL=http://celalyabuz-ds-wa:3001
      - SITE_URL=https://celalyabuz.store
      - ADMIN_PHONE=${ADMIN_PHONE:-905464233871}
    volumes:
      - celalyabuz-ds-db:/app/admin/db
      - celalyabuz-ds-uploads:/app/admin/uploads
      - celalyabuz-ds-uploads:/app/public/uploads
    depends_on:
      - dreamstudio-wa
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.celalyabuz-ds.rule=Host(`celalyabuz.store`) || Host(`www.celalyabuz.store`)"
      - "traefik.http.routers.celalyabuz-ds.entrypoints=websecure"
      - "traefik.http.routers.celalyabuz-ds.tls=true"
      - "traefik.http.routers.celalyabuz-ds.tls.certresolver=le"
      - "traefik.http.services.celalyabuz-ds.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.celalyabuz\\.store/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://celalyabuz.store/$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.celalyabuz-ds.middlewares=www-redirect"

  # ── DREAMSTUDIO WHATSAPP ─────────────────────────────
  dreamstudio-wa:
    build:
      context: .
      dockerfile: Dockerfile.wa
    image: celalyabuz-ds-wa:latest
    container_name: celalyabuz-ds-wa
    restart: unless-stopped
    volumes:
      - celalyabuz-ds-auth:/app/admin/auth_info
    networks:
      - internal